<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
    <defs>
        <!-- 整体图标的柔和微投影，增加在网页上的层次感 -->
        <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1B4965" flood-opacity="0.15"/>
        </filter>
    </defs>

    <!-- ================== 1. 背景：语言对话气泡 (象牙白底 + 爱琴海蓝边) ================== -->
    <path d="M 80 64 
             H 432 
             A 48 48 0 0 1 480 112 
             V 368 
             A 48 48 0 0 1 432 416 
             H 360 
             L 410 470 
             L 310 416 
             H 80 
             A 48 48 0 0 1 32 368 
             V 112 
             A 48 48 0 0 1 80 64 
             Z" 
          fill="#F7F4E9" 
          stroke="#1B4965" 
          stroke-width="16" 
          stroke-linejoin="round"
          filter="url(#shadow)"/>

    <!-- ================== 2. 顶部：雅典神庙三角楣 (陶土红) ================== -->
    <!-- 古典延伸屋檐 -->
    <line x1="114" y1="180" x2="398" y2="180" stroke="#C25946" stroke-width="14" stroke-linecap="round"/>
    
    <!-- 三角楣饰轮廓 (内部透出象牙白底色) -->
    <path d="M 256 110 L 130 180 L 382 180 Z" fill="#F7F4E9" stroke="#C25946" stroke-width="14" stroke-linejoin="round"/>
    
    <!-- 智慧之星 (雅典娜金 - 极简四芒星，象征启蒙与智慧) -->
    <path d="M 256 128 Q 256 150 278 150 Q 256 150 256 172 Q 256 150 234 150 Q 256 150 256 128 Z" fill="#DFA234"/>

    <!-- ================== 3. 中间层：雕带与立柱 (爱琴海蓝 & 雅典娜金) ================== -->
    <!-- 中楣排档间距上的黄金圆点装饰 (Triglyphs抽象化) -->
    <g fill="#DFA234">
        <circle cx="148" cy="190" r="3.5"/>
        <circle cx="184" cy="190" r="3.5"/>
        <circle cx="220" cy="190" r="3.5"/>
        <circle cx="256" cy="190" r="3.5"/>
        <circle cx="292" cy="190" r="3.5"/>
        <circle cx="328" cy="190" r="3.5"/>
        <circle cx="364" cy="190" r="3.5"/>
    </g>

    <!-- 承重主梁 (Architrave) -->
    <rect x="126" y="196" width="260" height="10" fill="#1B4965" rx="3"/>

    <!-- 4根经典希腊立柱 -->
    <rect x="136" y="206" width="24" height="119" fill="#1B4965" rx="2"/>
    <rect x="208" y="206" width="24" height="119" fill="#1B4965" rx="2"/>
    <rect x="280" y="206" width="24" height="119" fill="#1B4965" rx="2"/>
    <rect x="352" y="206" width="24" height="119" fill="#1B4965" rx="2"/>

    <!-- 立柱上的凹槽细节 (象牙白色，低透明度) -->
    <g stroke="#F7F4E9" stroke-width="2" stroke-linecap="round" opacity="0.35">
        <path d="M 144 210 V 321 M 152 210 V 321"/>
        <path d="M 216 210 V 321 M 224 210 V 321"/>
        <path d="M 288 210 V 321 M 296 210 V 321"/>
        <path d="M 360 210 V 321 M 368 210 V 321"/>
    </g>

    <!-- 神庙台阶基座 (Stylobate) - 巧妙地搁置在书页边缘 -->
    <rect x="116" y="325" width="280" height="10" rx="3" fill="#1B4965"/>

    <!-- ================== 4. 底部：展开的书本 (雅典娜金纸页 + 陶土红封皮) ================== -->
    <!-- 书本纸页侧面 (平滑下凹的三维翻开形态) -->
    <path d="M 110 335 Q 183 350 256 350 Q 329 350 402 335 L 402 365 Q 329 380 256 380 Q 183 380 110 365 Z" fill="#DFA234"/>
    
    <!-- 纸页侧面的细节刻画线 -->
    <path d="M 110 350 Q 183 365 256 365 Q 329 365 402 350" fill="none" stroke="#C88E2B" stroke-width="2"/>

    <!-- 精装书皮外壳 (向外略微延伸，提供托底感) -->
    <path d="M 106 360 L 110 365 Q 183 380 256 380 Q 329 380 402 365 L 406 360 L 406 372 Q 329 392 256 392 Q 183 392 106 372 Z" fill="#C25946"/>

    <!-- 爱琴海蓝书签飘带，增添英文阅读特征 -->
    <path d="M 248 370 V 415 L 256 407 L 264 415 V 370 Z" fill="#1B4965"/>

</svg>