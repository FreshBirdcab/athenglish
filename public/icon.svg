  <ellipse cx="18" cy="53" rx="3" ry="2" fill="#059669" />
  <ellipse cx="28" cy="58" rx="3" ry="2" fill="#059669" />
  <ellipse cx="35" cy="54" rx="3" ry="2" fill="#059669" />
