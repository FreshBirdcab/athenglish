<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
    <defs>
        <!-- 极简的扁平化阴影，让图标在网页上具有现代UI的微浮雕感 -->
        <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1B4965" flood-opacity="0.12"/>
        </filter>
    </defs>

    <!-- ================== 1. 背景：现代圆角矩形 (象牙白/米色) ================== -->
    <!-- 采用类似于 iOS 图标的超平滑圆角，完美适配任何网站的 Favicon 或 App 图标 -->
    <rect x="16" y="16" width="480" height="480" rx="112" fill="#F7F4E9" />

    <g filter="url(#softShadow)">
        <!-- ================== 2. 顶部：帕特农神庙三角楣 (陶土红) ================== -->
        <!-- 极简的三角形屋顶，略带圆角显得温润，同时构成字母“A”的顶部 -->
        <path d="M 256 120 L 386 210 H 126 Z" 
              fill="#C25946" 
              stroke="#C25946" 
              stroke-width="12" 
              stroke-linejoin="round"/>
        
        <!-- 负空间：中心智慧之眼/太阳 (镂空露出底色) -->
        <circle cx="256" cy="176" r="16" fill="#F7F4E9" />

        <!-- ================== 3. 中部：建筑横梁与三立柱 (爱琴海蓝) ================== -->
        <!-- 顶部承重横梁 (Architrave) -->
        <rect x="132" y="226" width="248" height="18" rx="6" fill="#1B4965" />

        <!-- 极简三立柱 (加粗设计，确保缩小后依然清晰，且横向排列极具稳定性) -->
        <rect x="132" y="244" width="40" height="76" fill="#1B4965" />
        <rect x="236" y="244" width="40" height="76" fill="#1B4965" />
        <rect x="340" y="244" width="40" height="76" fill="#1B4965" />

        <!-- 底部基座承重梁 (Stylobate) -->
        <rect x="132" y="320" width="248" height="18" rx="6" fill="#1B4965" />

        <!-- ================== 4. 底部：展开的书本基石 (雅典娜金) ================== -->
        <!-- 左侧书页：通过优美的贝塞尔曲线呈现翻开的动态 -->
        <path d="M 248 346 
                 C 190 346, 140 356, 104 376 
                 L 104 416 
                 C 140 396, 190 386, 248 386 
                 Z" 
              fill="#DFA234"/>
              
        <!-- 右侧书页：绝对对称的镜像曲线 -->
        <path d="M 264 346 
                 C 322 346, 372 356, 408 376 
                 L 408 416 
                 C 372 396, 322 386, 264 386 
                 Z" 
              fill="#DFA234"/>

        <!-- 书页上的极简线条点缀，增加书本的体积感 (使用象牙白) -->
        <path d="M 248 362 C 190 362, 144 370, 116 384" fill="none" stroke="#F7F4E9" stroke-width="4" stroke-linecap="round"/>
        <path d="M 264 362 C 322 362, 368 370, 396 384" fill="none" stroke="#F7F4E9" stroke-width="4" stroke-linecap="round"/>
    </g>
</svg>